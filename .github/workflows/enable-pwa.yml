name: Enable TRE-KA PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add PWA hooks to index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          head_marker = '<meta name="theme-color" content="#111111">\n<title>Моя тренировка</title>'
          head_insert = '''<meta name="theme-color" content="#111111">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="TRE-KA">
          <link rel="manifest" href="./manifest.webmanifest">
          <link rel="icon" href="./icon.svg" type="image/svg+xml">
          <link rel="apple-touch-icon" href="./icon.svg">
          <title>Моя тренировка</title>'''

          if '<link rel="manifest" href="./manifest.webmanifest">' not in text:
              if head_marker not in text:
                  raise SystemExit("Head marker not found; index.html left unchanged")
              text = text.replace(head_marker, head_insert, 1)

          sw_marker = 'showHome();\n\n</script>'
          sw_insert = '''showHome();

          if ("serviceWorker" in navigator) {
              window.addEventListener("load", () => {
                  navigator.serviceWorker.register("./sw.js")
                      .catch(error => console.error("Service worker registration failed:", error));
              });
          }

          </script>'''

          if 'navigator.serviceWorker.register("./sw.js")' not in text:
              if sw_marker not in text:
                  raise SystemExit("Script marker not found; index.html left unchanged")
              text = text.replace(sw_marker, sw_insert, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit PWA integration
        run: |
          if git diff --quiet -- index.html; then
            echo "PWA integration is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable TRE-KA as installable PWA"
          git push
